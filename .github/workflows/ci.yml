name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full tests
        run: npm test -- --runInBand

      - name: Lint
        run: npm run lint

      - name: Server type-check
        run: npm run type:check:server

      - name: Client type-check
        run: npm run type:check:client

      - name: Server build
        run: npm run build:server

      - name: Client build
        run: npm run build:client

  postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academic_writing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academic_writing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate standard PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academic_writing_test
        run: npm run test:integration:postgres
