name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full tests
        run: npm test -- --runInBand

      - name: Lint
        run: npm run lint

      - name: Server type-check
        run: npm run type:check:server

      - name: Client type-check
        run: npm run type:check:client

      - name: Server build
        run: npm run build:server

      - name: Client build
        run: npm run build:client

  production-gates:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production configuration and shutdown contracts
        run: npm test -- --runInBand test/unit/production-config.spec.ts test/unit/production-bootstrap.spec.ts test/unit/graceful-shutdown.spec.ts test/unit/reproducible-build.spec.ts

      - name: Validate production tooling is reproducible
        run: node scripts/test-reproducible-build.js

      - name: Build production artifact
        run: npm run build

      - name: Smoke test clean production artifact
        run: node scripts/test-production-artifact.js

  postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academic_writing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academic_writing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate standard PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academic_writing_test
        run: npm run db:migrate

      - name: Verify standard PostgreSQL schema and pgvector
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academic_writing_test
        run: npm run test:integration:postgres

      - name: Re-run migrations as an upgrade gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academic_writing_test
        run: npm run db:migrate

      - name: Create PostgreSQL backup
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academic_writing_test
          BACKUP_OUTPUT_PATH: /tmp/academic-writing-test.dump
        run: npm run db:backup

      - name: Restore and verify PostgreSQL backup
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academic_writing_test
          BACKUP_INPUT_PATH: /tmp/academic-writing-test.dump
        run: npm run db:restore:verify -- --confirm-restore
